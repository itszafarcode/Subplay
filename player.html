<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Плеер</title>
<style>
:root{
  color-scheme: light;
  --bg:#f3f5f8; --surface:#ffffff; --text:#171b24; --muted:#5d6678; --line:#d8dde6;
  --accent:#0e7c86; --accent-text:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#11151d; --surface:#1b212d; --text:#e8ebf2; --muted:#98a2b6; --line:#2b3342;
    --accent:#4fc1c9; --accent-text:#08262a;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#11151d; --surface:#1b212d; --text:#e8ebf2; --muted:#98a2b6; --line:#2b3342;
  --accent:#4fc1c9; --accent-text:#08262a;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.5; min-height:100vh;
}
main{max-width:860px; margin:0 auto; padding:16px}
h1{font-size:1.25rem; margin:4px 0 16px; font-weight:650}
.stage{
  background:#000; border-radius:12px; overflow:hidden;
  aspect-ratio:16/9; display:none; position:relative;
}
.stage:fullscreen{aspect-ratio:auto; border-radius:0; width:100%; height:100%}
.fs{position:absolute; top:8px; right:8px; width:40px; height:40px; border:0; border-radius:10px; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; cursor:pointer}
.fs:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.stage.on{display:block}
video{width:100%; height:100%; display:block; background:#000}
.empty{
  background:var(--surface); border:1.5px dashed var(--line); border-radius:12px;
  padding:40px 20px; text-align:center;
}
.empty p{margin:0 0 18px; color:var(--muted)}
.btn{
  font:inherit; font-weight:600; border:0; border-radius:10px; padding:12px 20px;
  background:var(--accent); color:var(--accent-text); cursor:pointer;
}
.btn.ghost{background:transparent; color:var(--text); border:1px solid var(--line)}
.btn:focus-visible,.speed button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.bar{display:none; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px}
.bar.on{display:flex}
.speed{display:flex; gap:6px}
.speed button{
  font:inherit; font-size:.9rem; padding:8px 12px; border-radius:8px; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--text);
}
.speed button[aria-pressed="true"]{background:var(--accent); color:var(--accent-text); border-color:var(--accent)}
.name{flex:1 1 100%; color:var(--muted); font-size:.9rem; overflow-wrap:anywhere}
.err{color:#c0392b; margin-top:12px; display:none}
.err.on{display:block}
.sub{position:absolute; left:0; right:0; bottom:16%; padding:0 8px; text-align:center; pointer-events:none}
.sub .txt{display:inline-block; max-width:94%; background:rgba(0,0,0,.62); color:#fff; padding:4px 10px; border-radius:6px; font-size:clamp(14px,4.2vw,22px); line-height:1.35; white-space:pre-line; overflow-wrap:anywhere; text-shadow:0 1px 2px rgba(0,0,0,.8)}
.sub .txt:empty{display:none}
.stage:fullscreen .sub .txt{font-size:clamp(18px,3.4vw,36px)}
.sub.off .txt{visibility:hidden}
.sync{display:flex; gap:6px; align-items:center; color:var(--muted); font-size:.9rem}
.sync button{font:inherit; font-size:.9rem; padding:8px 12px; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:var(--surface); color:var(--text)}
.sync button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.suberr{color:#c0392b; margin-top:12px; display:none}
.suberr.on{display:block}
.set{margin-top:20px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 16px}
.set summary{cursor:pointer; font-weight:600}
.set label{display:block; margin-top:12px; font-size:.9rem; color:var(--muted)}
.set input[type=password],.set input[type=text]{width:100%; font:inherit; padding:10px 12px; margin-top:4px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text)}
.set .row{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.set .msg{margin-top:12px; font-size:.9rem; overflow-wrap:anywhere}
.set .msg.bad{color:#c0392b}
.set .hint{margin-top:10px; font-size:.85rem; color:var(--muted)}
input[type=file]{display:none}
</style>
</head>
<body>
<main>
  <h1>Плеер</h1>

  <div class="empty" id="empty">
    <p>Выбери видео из памяти телефона. Оно не загружается в интернет.</p>
    <button class="btn" id="pick">Выбрать видео</button>
  </div>

  <div class="stage" id="stage">
    <video id="v" controls controlslist="nofullscreen" playsinline></video>
    <div class="sub" id="sub"><span class="txt" id="subtxt"></span></div>
    <button class="fs" id="fs" aria-label="На весь экран"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>

  <div class="suberr" id="suberr"></div>

  <div class="bar" id="bar">
    <div class="speed" id="speed" role="group" aria-label="Скорость">
      <button data-r="0.75" aria-pressed="false">0.75x</button>
      <button data-r="1" aria-pressed="true">1x</button>
      <button data-r="1.25" aria-pressed="false">1.25x</button>
    </div>
    <button class="btn ghost" id="other">Другое видео</button>
    <button class="btn ghost" id="subbtn">Субтитры</button>
    <div class="sync" role="group" aria-label="Сдвиг субтитров">
      <button id="earlier">Раньше</button>
      <span id="off">0 с</span>
      <button id="later">Позже</button>
    </div>
    <button class="btn ghost" id="hide">Скрыть</button>
    <div class="name" id="name"></div>
  </div>

  <div class="err" id="err">Не получилось открыть этот файл. Попробуй видео в формате MP4.</div>
  <details class="set" id="set">
    <summary>Настройки перевода (Gemini)</summary>
    <label for="key">Ключ Gemini (хранится только в этом браузере)</label>
    <input type="password" id="key" autocomplete="off" placeholder="Вставь ключ из Google AI Studio">
    <label for="model">Модель</label>
    <input type="text" id="model" autocomplete="off">
    <div class="row">
      <button class="btn" id="keysave">Сохранить</button>
      <button class="btn ghost" id="keytest">Проверить связь</button>
    </div>
    <div class="msg" id="keymsg"></div>
    <div class="hint">Ключ создаётся бесплатно в Google AI Studio. Никому его не показывай. Если модель отвечает ошибкой, замени её название в этом поле.</div>
  </details>
  <input type="file" id="file" accept="video/*">
  <input type="file" id="subfile">
</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var file=$('file'), v=$('v'), url=null, rate=1;

  function pick(){file.click()}
  $('pick').addEventListener('click',pick);
  $('other').addEventListener('click',pick);

  file.addEventListener('change',function(){
    var f=file.files && file.files[0];
    if(!f) return;
    if(url) URL.revokeObjectURL(url);
    url=URL.createObjectURL(f);
    $('err').classList.remove('on');
    v.src=url;
    v.playbackRate=rate;
    $('name').textContent=f.name;
    $('empty').style.display='none';
    $('stage').classList.add('on');
    $('bar').classList.add('on');
    file.value='';
  });

  v.addEventListener('loadedmetadata',function(){v.playbackRate=rate});
  v.addEventListener('error',function(){
    $('err').classList.add('on');
    $('stage').classList.remove('on');
    $('bar').classList.add('on');
  });

  $('speed').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    rate=parseFloat(b.getAttribute('data-r'));
    v.playbackRate=rate;
    var all=$('speed').querySelectorAll('button');
    for(var i=0;i<all.length;i++) all[i].setAttribute('aria-pressed',all[i]===b?'true':'false');
  });
  /* ---- Субтитры ---- */
  var cues=[], offset=0, last=-2, raf=0;
  var sub=$('sub'), subtxt=$('subtxt');

  function t(s){
    var m=/(?:(\d+):)?(\d{1,2}):(\d{2})[.,](\d{1,3})/.exec(s);
    if(!m) return null;
    return (+(m[1]||0))*3600+(+m[2])*60+(+m[3])+(+(m[4]+'00').slice(0,3))/1000;
  }

  function parse(txt){
    var out=[], blocks=txt.replace(/^\uFEFF/,'').replace(/\r/g,'').split(/\n{2,}/);
    for(var i=0;i<blocks.length;i++){
      var lines=blocks[i].split('\n'), k=-1;
      for(var j=0;j<lines.length;j++){ if(lines[j].indexOf('-->')>-1){k=j;break} }
      if(k<0) continue;
      var p=lines[k].split('-->'), a=t(p[0]), b=t(p[1]);
      if(a===null||b===null) continue;
      var text=lines.slice(k+1).join('\n').replace(/<[^>]*>/g,'').replace(/\{[^}]*\}/g,'').trim();
      if(text) out.push({s:a,e:b,t:text});
    }
    out.sort(function(x,y){return x.s-y.s});
    return out;
  }

  function cur(time){
    var x=time-offset, lo=0, hi=cues.length-1, f=-1;
    while(lo<=hi){ var m=(lo+hi)>>1; if(cues[m].s<=x){f=m;lo=m+1}else{hi=m-1} }
    for(var i=f;i>=0&&i>f-3;i--){ if(x<cues[i].e) return i }
    return -1;
  }

  function draw(){
    if(!cues.length) return;
    var i=cur(v.currentTime);
    if(i!==last){ last=i; subtxt.textContent = i>=0 ? cues[i].t : ''; }
  }

  function loop(){ draw(); raf=requestAnimationFrame(loop) }
  v.addEventListener('play',function(){ cancelAnimationFrame(raf); loop() });
  v.addEventListener('pause',function(){ cancelAnimationFrame(raf); draw() });
  v.addEventListener('seeked',draw);
  v.addEventListener('timeupdate',draw);

  function showOffset(){ $('off').textContent=(offset>0?'+':'')+offset.toFixed(1)+' с' }
  function shift(d){ offset=Math.round((offset+d)*10)/10; showOffset(); last=-2; draw() }
  $('earlier').addEventListener('click',function(){ shift(-0.5) });
  $('later').addEventListener('click',function(){ shift(0.5) });

  $('hide').addEventListener('click',function(){
    var off=sub.classList.toggle('off');
    $('hide').textContent = off ? 'Показать' : 'Скрыть';
  });

  $('subbtn').addEventListener('click',function(){ $('subfile').click() });
  $('subfile').addEventListener('change',function(){
    var f=this.files && this.files[0], inp=this;
    if(!f) return;
    f.text().then(function(txt){
      var c=parse(txt);
      if(!c.length){
        $('suberr').textContent='Не нашёл реплик в этом файле. Нужен формат .srt или .vtt.';
        $('suberr').classList.add('on');
        return;
      }
      $('suberr').classList.remove('on');
      cues=c; offset=0; last=-2; showOffset();
      sub.classList.remove('muted');
      subtxt.textContent='';
      draw();
    }).catch(function(){
      $('suberr').textContent='Не получилось прочитать файл субтитров.';
      $('suberr').classList.add('on');
    });
    inp.value='';
  });

  file.addEventListener('change',function(){
    cues=[]; offset=0; last=-2; showOffset();
    subtxt.textContent='';
  });
  /* ---- Полный экран: растягиваем всю сцену, чтобы субтитры остались ---- */
  var stage=$('stage');
  function inFs(){ return document.fullscreenElement||document.webkitFullscreenElement }
  $('fs').addEventListener('click',function(){
    if(inFs()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); return; }
    var req=stage.requestFullscreen||stage.webkitRequestFullscreen;
    if(!req) return;
    var p=req.call(stage);
    var lock=function(){ try{ screen.orientation.lock('landscape').catch(function(){}) }catch(e){} };
    if(p&&p.then) p.then(lock); else lock();
  });
  document.addEventListener('fullscreenchange',function(){
    if(!inFs()){ try{ screen.orientation.unlock() }catch(e){} }
  });
  /* ---- Gemini: ключ и проверка связи ---- */
  var keyEl=$('key'), modelEl=$('model'), keymsg=$('keymsg');
  var DEFAULT_MODEL='gemini-3.8-flash';
  function lsGet(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }
  function lsSet(k,val){ try{ localStorage.setItem(k,val); return true }catch(e){ return false } }
  keyEl.value=lsGet('gem_key')||'';
  modelEl.value=lsGet('gem_model')||DEFAULT_MODEL;
  function say(text,bad){ keymsg.textContent=text; keymsg.className='msg'+(bad?' bad':'') }

  $('keysave').addEventListener('click',function(){
    var a=lsSet('gem_key',keyEl.value.trim()), b=lsSet('gem_model',modelEl.value.trim()||DEFAULT_MODEL);
    say(a&&b ? 'Сохранено в этом браузере.' : 'Браузер не дал сохранить. Ключ будет работать, пока страница открыта.', !(a&&b));
  });

  function askGemini(prompt){
    var key=keyEl.value.trim(), model=modelEl.value.trim()||DEFAULT_MODEL;
    if(!key) return Promise.reject(new Error('Сначала вставь ключ.'));
    return fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-goog-api-key':key},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})
    }).then(function(r){
      return r.json().catch(function(){return {}}).then(function(j){
        if(!r.ok) throw new Error((j.error&&j.error.message)||('Ошибка '+r.status));
        var c=j.candidates&&j.candidates[0], p=c&&c.content&&c.content.parts;
        if(!p||!p.length) throw new Error('Gemini вернул пустой ответ.');
        return p.map(function(x){return x.text||''}).join('').trim();
      });
    });
  }
  window.askGemini=askGemini;

  $('keytest').addEventListener('click',function(){
    say('Проверяю…');
    askGemini('Переведи на русский одним словом: hello').then(function(t){
      say('Работает. Ответ Gemini: '+t);
    }).catch(function(e){
      say(e instanceof TypeError
        ? 'Нет связи с Gemini. Если страница открыта внутри Claude, внешние запросы там заблокированы, это нормально. Проверим, когда выложим страницу на свой бесплатный хостинг.'
        : 'Сбой: '+e.message, true);
    });
  });
})();
</script>
</body>
</html>
